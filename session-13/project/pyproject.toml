# ShopWise v10 — the support assistant as an installable package and a web API.
#
# This project is its own uv project: `uv sync` here builds project/.venv with
# only what the service needs (no Jupyter, no notebook stack). That is also how
# session 16 installs it on the server: `uv sync --locked --no-default-groups`.

[project]
name = "shopwise"
version = "10.0.0"
description = "ShopWise customer-support assistant: a LangGraph team behind a FastAPI API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # the web layer
    "fastapi[standard]>=0.141.1",       # includes uvicorn and the `fastapi` CLI
    "scalar-fastapi>=1.4",              # the Scalar API reference at /scalar
    # configuration
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    # the brain: LangChain + LangGraph, pinned as in the course
    "langchain>=1.3.14,<2",
    "langgraph>=1.2.10,<1.3",           # langchain 1.3.x caps langgraph at <1.3
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "sqlite-vec>=0.1.6",                # the memory Store's vector index
    # model providers: OpenRouter default, Gemini for embeddings, Groq fallback
    "langchain-openrouter>=0.2.9,<0.3",
    "langchain-google-genai>=4.3.2,<5",
    "langchain-groq>=1.1.3,<2",
    # the knowledge base
    "qdrant-client[fastembed]>=1.15",
    "langchain-qdrant>=1.0",
    "langchain-text-splitters>=1.1",
    "pypdf>=6.0",
    # MCP (server and client) and the [ADV] market analyst's search
    "mcp[cli]>=1.24,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langchain-tavily>=0.2.18,<0.3",
    "ddgs>=9.16",
]

[dependency-groups]
# Installed by a plain `uv sync`; left out on the server with --no-default-groups.
dev = [
    "ruff>=0.14",
    "openevals>=0.2",                   # evals/ (LLM-as-judge)
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Files inside the package that are not Python. A non-editable install that
# forgot these would fail at startup on a missing prompt or example.
[tool.setuptools.package-data]
shopwise = [
    "llm/prompts/*/*.yml",
    "llm/skills/*/SKILL.md",
    "llm/kb/*.yml",
    "api/v1/examples/*.json",
]

# `uv run fastapi dev` and `uv run fastapi run` find the app here.
[tool.fastapi]
entrypoint = "shopwise.main:app"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E402", "B008"]   # long docstrings · late imports · Depends() in defaults
