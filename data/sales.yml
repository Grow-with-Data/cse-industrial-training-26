# Sales — fourteen days of order lines, for the [ADV] Daily Brief (session 10).
#
# The order fixture in backend.yml has four orders, which is enough for support
# questions and nowhere near enough for "yesterday's sales". These lines are the
# shop's till roll for 24 July to 6 August 2026: one entry per product per
# order, generated once with a fixed seed and committed, so every participant's
# brief sums the same numbers.
#
# Grouped by PRODUCT TYPE, never "category": category is the word for what a
# TICKET is about (CONTEXT.md). backend.yml's products carry product_type, and
# the brief joins on sku to read it.
#
# Deliberate: SKU-300 (the kettle) stops selling on 2 August, the day its stock
# hit zero in backend.yml. A brief that notices a best-seller went silent is
# worth more than one that only adds up.
#
# Fields: id (SALE-nnnn) · date (quoted, see backend.yml for why) · sku (a key
# in backend.yml products) · qty · unit_price (the price on that day).

